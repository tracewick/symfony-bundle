name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PR_PHP_VERSION: '8.5'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PR_PHP_VERSION }}
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4
        id: install

      - name: Normalize composer.json
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer normalize:check

      - name: Coding style
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer cs:check

      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer rector:check

      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer stan -- --error-format=github

      - name: Dependency analysis
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer deps

      - name: Tests with coverage
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Security audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer audit

  matrix:
    name: Tests (PHP ${{ matrix.php }}, SF ${{ matrix.symfony }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: highest
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: lowest
          - php: '8.3'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.4'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.4'
            symfony: '8.1.*'
            dependencies: highest
          - php: '8.5'
            symfony: '8.1.*'
            dependencies: highest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Enforce Symfony version
        run: |
          composer config extra.symfony.require '${{ matrix.symfony }}'
          composer config minimum-stability stable
          composer require --no-update \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/framework-bundle:${{ matrix.symfony }}"

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        run: composer test:unit

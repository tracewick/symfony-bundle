name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Heavy Checks job (coverage, Infection, stan) stays on one PHP version.
  PR_PHP_VERSION: '8.5'
  INFECTION_VERSION: '0.35.8'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PR_PHP_VERSION }}
          coverage: pcov
          # Infection is a PHAR, not a dev dependency: recent versions need PHP 8.3+ and would
          # block installing dependencies on PHP 8.2 in the matrix.
          tools: composer:v2, infection:${{ env.INFECTION_VERSION }}

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4
        id: install

      - name: Normalize composer.json
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer normalize:check

      - name: Coding style
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer cs:check

      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer rector:check

      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer stan -- --error-format=github

      - name: Dependency analysis
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer deps

      - name: Tests with coverage
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage gates are enforced by Codecov's status checks, not by this upload.
          fail_ci_if_error: false

      - name: Mutation testing
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          # Safety net if coverage is empty (misconfigured run). Normal builds have executable src/.
          if tail -n 3 build/coverage/clover.xml | grep -q ' statements="0"'; then
            echo '::notice::Coverage reports zero statements; skipping mutation testing.'
            exit 0
          fi
          composer infection:ci

      - name: Security audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer audit

  matrix:
    name: Tests (PHP ${{ matrix.php }}, SF ${{ matrix.symfony }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: highest
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: lowest
          - php: '8.3'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.4'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.4'
            symfony: '8.1.*'
            dependencies: highest
          - php: '8.5'
            symfony: '8.1.*'
            dependencies: highest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Enforce Symfony version
        run: |
          composer config extra.symfony.require '${{ matrix.symfony }}'
          composer config minimum-stability stable
          composer require --no-update \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/framework-bundle:${{ matrix.symfony }}"

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        # Unit + functional Kernel/spool smoke (no ext-excimer required).
        run: composer test

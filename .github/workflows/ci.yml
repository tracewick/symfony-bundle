name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Heavy Checks job (coverage, Infection, stan) stays on one PHP version.
  PR_PHP_VERSION: '8.5'
  INFECTION_VERSION: '0.35.8'

jobs:
  release-check:
    name: Release packaging (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No publishing or OIDC permissions; fixtures are explicitly unsigned.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify the actual exported package
        run: |
          python3 scripts/release-package.py --output build/release --version 0.0.0-snapshot
          (cd build/release && sha256sum --check checksums.txt)
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate the package SBOM against CycloneDX 1.6
        run: |
          python3 -m pip install 'jsonschema==4.26.0'
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          from jsonschema import Draft7Validator
          from referencing import Registry, Resource
          registry = Registry()
          base = 'https://raw.githubusercontent.com/CycloneDX/specification/55343ba19dee1785acf1ce9191540d5fd7b590db/schema/'
          for name in ('bom-1.6.schema.json', 'spdx.schema.json', 'jsf-0.82.schema.json'):
              with urllib.request.urlopen(base + name, timeout=30) as stream:
                  document = json.load(stream)
              resource = Resource.from_contents(document)
              for prefix in ('http://cyclonedx.org/schema/', 'https://cyclonedx.org/schema/'):
                  registry = registry.with_resource(prefix + name, resource)
              if name == 'bom-1.6.schema.json':
                  schema = document
          bom = json.loads(pathlib.Path('build/release/tracewick-symfony-bundle-0.0.0-snapshot.sbom.json').read_text())
          Draft7Validator(schema, registry=registry).validate(bom)
          PY

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PR_PHP_VERSION }}
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v4
        id: install

      - name: Normalize composer.json
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer normalize:check

      - name: Coding style
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer cs:check

      - name: Rector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer rector:check

      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer stan -- --error-format=github

      - name: Dependency analysis
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer deps

      - name: Tests with coverage
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage gates are enforced by Codecov's status checks, not by this upload.
          fail_ci_if_error: false

      - name: Security audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer audit

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PR_PHP_VERSION }}
          extensions: ':excimer'
          coverage: pcov
          tools: composer:v2, infection:${{ env.INFECTION_VERSION }}
      - uses: ramsey/composer-install@v4
      - run: composer test:coverage
      - name: Verify coverage input
        run: |
          php <<'PHP'
          <?php
          $coverage = simplexml_load_file('build/coverage/clover.xml');
          if ($coverage === false || (int) $coverage->project->metrics['coveredstatements'] === 0) {
              fwrite(STDERR, "Expected nonempty source coverage.\n");
              exit(1);
          }
          PHP
      - run: composer infection:ci

  matrix:
    name: Tests (PHP ${{ matrix.php }}, SF ${{ matrix.symfony }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: highest
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: lowest
          - php: '8.3'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.4'
            symfony: '7.4.*'
            dependencies: highest
          - php: '8.4'
            symfony: '8.1.*'
            dependencies: highest
          - php: '8.5'
            symfony: '8.1.*'
            dependencies: highest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Enforce Symfony version
        run: |
          composer config extra.symfony.require '${{ matrix.symfony }}'
          composer config minimum-stability stable
          composer require --no-update \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/framework-bundle:${{ matrix.symfony }}"

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        # Unit + functional Kernel/spool smoke (no ext-excimer required).
        run: composer test
